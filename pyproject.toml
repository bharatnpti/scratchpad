[tool.poetry]
name = "llm-agent-system"
version = "0.1.0"
description = "Modular LLM Powered Agent System"
authors = ["AI Agent <ai.agent@example.com>"]
readme = "README.md"
packages = [{include = "llm_agent_system"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
python-dotenv = "^1.0.0"
openai = "^1.3.3"
pinecone-client = "^2.2.4" # Replace if another vector DB is chosen
sqlalchemy = {extras = ["mypy"], version = "^2.0.23"}
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9" # For PostgreSQL
redis = {extras = ["hiredis"], version = "^5.0.1"}
httpx = "^0.25.1"

[tool.poetry.group.dev.dependencies]
flake8 = "^6.1.0"
pylint = "^3.0.2"
black = "^23.11.0"
isort = "^5.12.0"
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
mypy = "^1.7.0" # For type checking

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint.master]
# Ignore C0114 (missing-module-docstring), C0115 (missing-class-docstring), C0116 (missing-function-docstring) for now
disable = ["C0114", "C0115", "C0116", "R0903"] # R0903: too-few-public-methods

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # Initially true, can be refined
# strict_optional = true # Enable for stricter checking later
