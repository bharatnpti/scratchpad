# Test specific properties
# For example, if we wanted to use H2 for some integration tests:
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop # For H2, create-drop is often used for tests

# For @WebMvcTest with mocked services, these DB properties are not strictly necessary
# unless other components pulled in require them.

# Mock an OpenAI API Key for tests if Spring AI components are loaded
spring.ai.openai.api-key=TEST_API_KEY_DO_NOT_USE
logging.level.org.springframework.ai=INFO # Reduce AI logging noise for tests
