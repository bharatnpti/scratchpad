# Spring Boot application properties
spring.application.name=llm-agent-system

# Database Configuration (PostgreSQL) - Replace with actual values
spring.datasource.url=jdbc:postgresql://localhost:5432/llm_agent_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate # Use 'validate' with Flyway, 'update' or 'create-drop' for dev without Flyway
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Spring AI OpenAI Configuration - Replace with actual values or use environment variables
spring.ai.openai.api-key=YOUR_OPENAI_API_KEY
spring.ai.openai.chat.options.model=gpt-3.5-turbo # or gpt-4, etc.

# Spring AI Qdrant Configuration - Replace with actual values
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334 # Default gRPC port for Qdrant
spring.ai.vectorstore.qdrant.collectionName=llm_agent_embeddings
# spring.ai.vectorstore.qdrant.embeddingDimension - May need to be set if not inferred

# Logging
logging.level.org.springframework.ai=DEBUG
logging.level.com.example.llmagentsystem=INFO
